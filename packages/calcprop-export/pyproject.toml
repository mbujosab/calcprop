[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calcprop-export"
version = "0.1.0"
description = "Export calcprop questions to AMC (LaTeX), Moodle (XML via LaTeX) and Jupyter"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "calcprop-quiz>=0.1",
]

[project.urls]
Homepage = "https://github.com/mbujosab/calcprop"
Source   = "https://github.com/mbujosab/calcprop"

[tool.hatch.build.targets.wheel]
packages = ["src/calcprop_export"]
