[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calcprop"
version = "0.1.4"
description = "Propositional calculus library"
authors = [
    {name = "Marcos Bujosa", email = "mbujosab@ucm.es"},
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = []
keywords = ["propositional calculus", "logic", "education", "mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/mbujosab/calcprop"
Source   = "https://github.com/mbujosab/calcprop"

[tool.hatch.build.targets.wheel]
packages = ["src/calcprop"]
